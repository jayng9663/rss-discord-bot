<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS → Discord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235865f2'/%3E%3Ccircle cx='10' cy='22' r='3' fill='white'/%3E%3Cpath d='M7 13a12 12 0 0 1 12 12M7 7a18 18 0 0 1 18 18' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root { --bg:#313338; --bg2:#2b2d31; --bg3:#1e1f22; --bg4:#3f4248; --text:#dbdee1; --muted:#949ba4; --head:#f2f3f5;
        --accent:#5865f2; --green:#23a55a; --red:#f23f43; --yellow:#f0b232; --link:#00a8fc; --radius:8px; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 "gg sans", "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
       background: var(--bg3); color: var(--text); min-height: 100vh; }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg2); box-shadow: 0 1px 0 #0004; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 12px 24px; max-width: 1140px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; color: var(--head); }
.brand svg { width: 30px; height: 30px; }
.status { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.dot.busy { background: var(--yellow); animation: pulse 1s infinite; }
.dot.down { background: var(--red); }
@keyframes pulse { 50% { opacity: .3 } }
.spacer { flex: 1; }
nav { display: flex; gap: 4px; padding: 0 24px; max-width: 1140px; margin: 0 auto; }
nav button { background: none; border: none; color: var(--muted); padding: 10px 14px; font: inherit; font-weight: 600;
             cursor: pointer; border-bottom: 2px solid transparent; }
nav button.active { color: var(--head); border-bottom-color: var(--accent); }
nav button:hover { color: var(--text); }
nav .count { background: var(--bg4); border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
main { max-width: 1140px; margin: 0 auto; padding: 24px; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar h2 { margin: 0; font-size: 20px; color: var(--head); }
.hint { color: var(--muted); font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.btn { border: none; border-radius: 4px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
       background: var(--bg4); color: var(--head); white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.green { background: var(--green); color: #fff; }
.btn.danger { background: transparent; color: var(--red); }
.btn.danger:hover { background: var(--red); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--bg); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 14px;
        align-items: center; border-left: 4px solid var(--bg4); }
.card.paused { opacity: .6; }
.card .body { flex: 1; min-width: 0; }
.card .title { color: var(--head); font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--bg4);
         color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
.badge.ok { background: #23a55a2e; color: #57d68d; }
.badge.err { background: #f23f432e; color: #ff7b7e; }
.badge.warn { background: #f0b2322e; color: var(--yellow); }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--bg4); flex-shrink: 0; }
.avatar.sm { width: 20px; height: 20px; }
.avatar.lg { width: 72px; height: 72px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg2); border-radius: 999px;
        padding: 2px 10px 2px 2px; font-size: 12px; color: var(--text); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); background: var(--bg); border-radius: var(--radius); }
.empty b { color: var(--head); display: block; font-size: 16px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }
.overlay { position: fixed; inset: 0; background: #000b; display: flex; align-items: flex-start; justify-content: center;
           padding: 40px 16px; overflow: auto; z-index: 20; }
.modal { background: var(--bg); border-radius: 10px; width: 100%; max-width: 660px; box-shadow: 0 8px 40px #0009; }
.modal h3 { margin: 0; padding: 20px 20px 4px; color: var(--head); font-size: 20px; }
.modal .content { padding: 12px 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.modal .footer { padding: 14px 20px; background: var(--bg2); border-radius: 0 0 10px 10px; display: flex; justify-content: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > .label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .02em; }
input[type=text], input[type=url], input[type=number], input[type=password], textarea, select {
  background: var(--bg3); border: 1px solid transparent; border-radius: 4px; color: var(--text); padding: 9px 10px;
  font: inherit; width: 100%; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input:disabled { opacity: .6; }
input[type=color] { width: 52px; height: 38px; border: none; background: none; padding: 0; cursor: pointer; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.row { display: flex; gap: 14px; } .row > * { flex: 1; min-width: 0; }
.inline { display: flex; gap: 8px; align-items: center; } .inline > input { flex: 1; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg2); border-radius: 6px;
         cursor: pointer; font-size: 14px; color: var(--text); }
.check:hover { background: var(--bg4); }
.preview { background: var(--bg); border: 1px solid var(--bg4); border-radius: 8px; padding: 14px; }
.msg { display: flex; gap: 14px; }
.msg .who { color: var(--head); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.app-tag { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
.when { color: var(--muted); font-size: 12px; font-weight: 400; }
.embed { margin-top: 6px; background: var(--bg2); border-left: 4px solid var(--accent); border-radius: 4px;
         padding: 10px 14px 12px; max-width: 500px; }
.embed .author { font-size: 13px; font-weight: 600; color: var(--head); margin-bottom: 6px; }
.embed .etitle { color: var(--link); font-weight: 600; margin-bottom: 6px; display: block; }
.embed .desc { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.embed img.big { max-width: 100%; max-height: 300px; border-radius: 4px; margin-top: 10px; display: block; }
.embed .foot { margin-top: 8px; font-size: 12px; color: var(--muted); }
.info-box { display: flex; gap: 12px; align-items: center; background: var(--bg2); padding: 10px 12px; border-radius: 6px; font-size: 13px; }
.info-box.err { color: #ff7b7e; }
.avatar-edit { display: flex; gap: 16px; align-items: center; }
.avatar-edit .side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.log { background: var(--bg3); border-radius: 6px; padding: 10px 12px; font: 12px/1.55 ui-monospace, "JetBrains Mono", Menlo, monospace;
       max-height: 460px; overflow: auto; white-space: pre-wrap; color: var(--muted); overflow-wrap: anywhere; }
.log .warn { color: var(--yellow); } .log .error { color: #ff7b7e; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 820px) {
  .grid2 { grid-template-columns: 1fr; } .row { flex-direction: column; }
  .card { flex-wrap: wrap; } .card .body { flex-basis: calc(100% - 60px); } .card .actions { flex-basis: 100%; justify-content: flex-start; }
  .topbar { flex-wrap: wrap; padding: 10px 16px; gap: 8px 16px; } .status { order: 3; flex-basis: 100%; }
  nav { padding: 0 8px; overflow-x: auto; } main { padding: 16px; }
}
section.panel { background: var(--bg); border-radius: var(--radius); padding: 18px; }
section.panel h3 { margin: 0 0 12px; color: var(--head); font-size: 15px; }
.post { padding: 8px 0; border-bottom: 1px solid var(--bg4); }
.post:last-child { border-bottom: none; }
.settings { display: flex; flex-direction: column; gap: 16px; max-width: 640px; }
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { background: var(--bg4); color: var(--head); padding: 10px 14px; border-radius: 6px; box-shadow: 0 4px 20px #0007;
         border-left: 4px solid var(--green); max-width: 420px; }
.toast.err { border-left-color: var(--red); }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 12px; }
.back { background: none; border: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 14px; }
.back:hover { color: var(--head); }
.feed-head { background: var(--bg); border-radius: var(--radius); padding: 16px 18px; border-left: 4px solid var(--accent); margin-bottom: 18px; }
.feed-head h2 { margin: 0 0 4px; color: var(--head); font-size: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.target-pick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.target-pick label { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 999px;
                     padding: 3px 10px 3px 4px; font-size: 13px; cursor: pointer; border: 1px solid var(--bg4); }
.target-pick label.on { border-color: var(--accent); background: #5865f222; }
.target-pick input { display: none; }
.item { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; }
.item .top { display: flex; gap: 14px; align-items: flex-start; }
.item .thumb { width: 84px; height: 84px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--bg4); }
.item .body { flex: 1; min-width: 0; }
.item .ititle { color: var(--head); font-weight: 600; font-size: 15px; }
.item .meta { color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; color: var(--text); }
.item .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.item .expanded { margin-top: 12px; }
.chip.posted { background: #23a55a26; color: #7ee2a8; }
.chip.skipped { background: var(--bg2); color: var(--muted); }
.chip.new { background: #f0b23226; color: var(--yellow); }
.job { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 14px; align-items: center; }
.job .body { flex: 1; min-width: 0; }
.progress { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress > div { height: 100%; background: var(--accent); transition: width .4s; }
.progress.err > div { background: var(--red); }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#5865f2"/><circle cx="10" cy="22" r="3" fill="#fff"/><path d="M7 13a12 12 0 0 1 12 12M7 7a18 18 0 0 1 18 18" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      RSS → Discord
    </div>
    <div class="status" id="status"></div>
    <div class="spacer"></div>
    <button class="btn primary" id="pollAll" title="Check every feed now">Check now</button>
  </div>
  <nav id="tabs">
    <button data-tab="feeds" class="active">Feeds</button>
    <button data-tab="webhooks">Webhooks</button>
    <button data-tab="activity">Activity</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>
<main id="main"><div class="empty"><b>Loading…</b></div></main>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
const DEFAULT_AVATAR = 'https://cdn.discordapp.com/embed/avatars/0.png';
const S = { tab: 'feeds', config: null, status: null, online: true };

// ---- helpers ---------------------------------------------------------------
function $(sel) { return document.querySelector(sel); }
function h(tag, attrs) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of Array.prototype.slice.call(arguments, 2).flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false || kid === '') continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}
async function api(method, path, body) {
  const opts = { method: method, headers: { 'X-Requested-With': 'rssbot' } };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (e) { /* not JSON */ }
  if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
  return data;
}
function toast(msg, isErr) {
  const t = h('div', { class: 'toast' + (isErr ? ' err' : '') }, msg);
  $('#toasts').append(t);
  setTimeout(function () { t.remove(); }, isErr ? 8000 : 3500);
}
function dur(s) {
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s / 60) + 'm';
  if (s < 86400) return Math.round(s / 3600) + 'h';
  return Math.round(s / 86400) + 'd';
}
function ago(ts) {
  if (!ts) return 'never';
  const s = Math.round(Date.now() / 1000 - ts);
  return s < 0 ? 'in ' + dur(-s) : (s < 5 ? 'just now' : dur(s) + ' ago');
}
function avatarImg(src, cls) {
  const i = h('img', { class: cls || 'avatar', src: src || DEFAULT_AVATAR, alt: '', referrerpolicy: 'no-referrer' });
  i.addEventListener('error', function () { if (i.src !== DEFAULT_AVATAR) i.src = DEFAULT_AVATAR; });
  return i;
}
function field(label, control, hint) {
  return h('div', { class: 'field' }, h('div', { class: 'label' }, label, hint ? h('span', { class: 'hint' }, ' · ' + hint) : null), control);
}
function webhookById(id) { return S.config.webhooks.find(function (w) { return w.id === id; }); }
function whLabel(w) { return w ? (w.name || w.username || w.id) : '(deleted webhook)'; }
function whName(w) { return (w && w.username) || S.config.settings.username || 'RSS'; }
function whAvatar(w) { return (w && w.avatar_url) || S.config.settings.avatar_url || DEFAULT_AVATAR; }
function cut(text, n) { return text.length > n ? text.slice(0, n - 1).trimEnd() + '…' : text; }
function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function modal(title, content, buttons) {
  const overlay = h('div', { class: 'overlay' });
  const close = function () { overlay.remove(); };
  overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
  overlay.append(h('div', { class: 'modal', role: 'dialog' }, h('h3', null, title), h('div', { class: 'content' }, content),
    h('div', { class: 'footer' }, buttons)));
  document.body.append(overlay);
  const first = overlay.querySelector('input:not([type=checkbox]):not([type=color]):not([type=file])');
  if (first) first.focus();
  return close;
}
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  const all = document.querySelectorAll('.overlay');
  if (all.length) all[all.length - 1].remove();
});

// Square-crops and scales an uploaded image to 256x256 PNG for the Discord avatar.
function squareImage(file) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const size = 256, c = document.createElement('canvas');
      c.width = size; c.height = size;
      const m = Math.min(img.naturalWidth, img.naturalHeight);
      c.getContext('2d').drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file is not an image')); };
    img.src = url;
  });
}

// Renders something that looks like the Discord message the bot will send.
function messagePreview(m) {
  const e = m.embed;
  const foot = [e.footer, e.timestamp ? new Date(e.timestamp).toLocaleString() : null].filter(Boolean).join(' • ');
  const embed = h('div', { class: 'embed', style: { borderLeftColor: e.color } },
    e.author ? h('div', { class: 'author' }, e.author) : null,
    e.url ? h('a', { class: 'etitle', href: e.url, target: '_blank', rel: 'noopener noreferrer' }, e.title)
          : h('span', { class: 'etitle' }, e.title),
    e.description ? h('div', { class: 'desc' }, e.description) : null,
    e.image ? h('img', { class: 'big', src: e.image, alt: '', referrerpolicy: 'no-referrer' }) : null,
    foot ? h('div', { class: 'foot' }, foot) : null);
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return h('div', { class: 'msg' }, avatarImg(m.avatar),
    h('div', { style: { minWidth: 0, flex: 1 } },
      h('div', { class: 'who' }, m.username, h('span', { class: 'app-tag' }, 'APP'), h('span', { class: 'when' }, 'Today at ' + time)),
      m.content ? h('div', null, m.content) : null,
      embed));
}

// ---- data ------------------------------------------------------------------
async function reloadConfig() { S.config = await api('GET', '/api/config'); render(); }
async function refreshStatus() {
  const before = {};
  if (S.status) S.status.jobs.forEach(function (j) { before[j.id] = j.state; });
  try {
    S.status = await api('GET', '/api/status');
    S.online = true;
  } catch (e) { S.online = false; }
  if (S.online) {
    let active = false;
    for (const j of S.status.jobs) {
      const was = before[j.id];
      const running = j.state === 'queued' || j.state === 'running';
      active = active || running;
      if ((was === 'queued' || was === 'running') && !running) {
        toast(j.feed + ': ' + (j.state === 'cancelled' ? 'repost cancelled' : j.message), j.state === 'failed');
        if (S.detail && S.detail.id === j.feed_id) loadFeedItems(true);
      }
    }
    if (active && !S.fastTimer) S.fastTimer = setTimeout(function () { S.fastTimer = null; refreshStatus(); }, 1200);
  }
  renderHeader();
  if ((S.tab === 'feeds' || S.tab === 'activity') && !document.querySelector('.overlay')) renderTab();
}
function pollSoon() { setTimeout(refreshStatus, 600); setTimeout(refreshStatus, 2500); setTimeout(refreshStatus, 6000); }
async function pollNow(feedId) {
  try {
    await api('POST', '/api/poll', feedId ? { feed_id: feedId } : {});
    toast(feedId ? 'Checking the feed…' : 'Checking all feeds…');
    pollSoon();
  } catch (e) { toast(e.message, true); }
}

// ---- layout ----------------------------------------------------------------
function render() { renderHeader(); renderTab(); }
function renderHeader() {
  const el = $('#status'), s = S.status;
  el.replaceChildren();
  if (!S.online) { el.append(h('span', { class: 'dot down' }), 'Bot not reachable'); return; }
  if (!s) return;
  el.append(h('span', { class: 'dot' + (s.polling ? ' busy' : '') }),
    s.polling ? 'Checking feeds…' : 'Last check ' + ago(s.last_poll) + (s.next_poll ? ' · next ' + ago(s.next_poll) : ''),
    s.dry_run ? h('span', { class: 'badge warn' }, 'dry run') : '');
  if (S.config) {
    document.querySelectorAll('#tabs button').forEach(function (b) {
      const n = b.dataset.tab === 'feeds' ? S.config.feeds.length : b.dataset.tab === 'webhooks' ? S.config.webhooks.length : null;
      b.replaceChildren(b.dataset.tab[0].toUpperCase() + b.dataset.tab.slice(1), n === null ? '' : h('span', { class: 'count' }, n));
    });
  }
}
function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
  renderTab();
}
function renderTab() {
  if (!S.config || !S.status) return;
  const view = S.tab === 'feeds' && S.detail ? feedDetailView
    : { feeds: feedsView, webhooks: webhooksView, activity: activityView, settings: settingsView }[S.tab];
  const scroller = document.querySelector('.log');
  const logScroll = scroller ? scroller.scrollTop : 0;
  $('#main').replaceChildren(view());
  const newLog = document.querySelector('.log');
  if (newLog) newLog.scrollTop = logScroll;
}

// ---- feeds -----------------------------------------------------------------
function feedsView() {
  const feeds = S.config.feeds, webhooks = S.config.webhooks;
  const wrap = h('div', null, h('div', { class: 'toolbar' }, h('h2', null, 'Feeds'),
    h('span', { class: 'hint' }, 'RSS / Atom feeds and where they are posted'), h('div', { class: 'spacer' }),
    h('button', { class: 'btn primary', onclick: function () { feedModal(); }, disabled: !webhooks.length }, '+ Add feed')));
  if (!webhooks.length) {
    wrap.append(h('div', { class: 'empty' }, h('b', null, 'Start by adding a webhook'),
      'Feeds are posted to Discord through webhooks — one per channel, in any server.', h('br'),

async function toggleFeed(f) {

async function deleteFeed(f) {

function feedModal(f) {
  const editing = !!f, webhooks = S.config.webhooks;
  const v = {
    url: editing ? f.url : '', name: editing ? f.name : '', color: editing ? f.color : S.config.settings.color,
    webhooks: editing ? f.webhooks.slice() : (webhooks.length === 1 ? [webhooks[0].id] : []),
    summary_length: editing ? f.summary_length : 350, show_image: editing ? f.show_image : true,
    enabled: editing ? f.enabled : true
  };
  let preview = null;

  const urlIn = h('input', { type: 'url', value: v.url, placeholder: 'https://example.com/feed.xml', spellcheck: 'false' });
  urlIn.addEventListener('input', function () { v.url = urlIn.value.trim(); });
  urlIn.addEventListener('change', function () { if (v.url) loadPreview(); });
  const nameIn = h('input', { type: 'text', value: v.name, placeholder: 'Defaults to the feed title' });
  nameIn.addEventListener('input', function () { v.name = nameIn.value.trim(); update(); });
  const colorIn = h('input', { type: 'color', value: v.color });
  colorIn.addEventListener('input', function () { v.color = colorIn.value; update(); });
  const sumIn = h('input', { type: 'number', min: 0, max: 4096, value: v.summary_length });
  sumIn.addEventListener('input', function () { v.summary_length = Math.max(0, parseInt(sumIn.value, 10) || 0); update(); });
  const imgChk = h('input', { type: 'checkbox', checked: v.show_image });
  imgChk.addEventListener('change', function () { v.show_image = imgChk.checked; update(); });

  const targets = h('div', { class: 'list', style: { gap: '6px' } }, webhooks.map(function (w) {
    const c = h('input', { type: 'checkbox', checked: v.webhooks.indexOf(w.id) >= 0 });
    c.addEventListener('change', function () {
      if (c.checked) v.webhooks.push(w.id); else v.webhooks = v.webhooks.filter(function (x) { return x !== w.id; });
      update();
    });
    return h('label', { class: 'check' }, c, avatarImg(whAvatar(w), 'avatar sm'), h('span', null, whLabel(w)),
      h('span', { class: 'hint' }, 'posts as ' + whName(w)));
  }));

  const previewBox = h('div', { class: 'preview' }, h('span', { class: 'hint' }, 'Enter a feed URL and press Load to preview the newest post.'));
  const loadBtn = h('button', { class: 'btn', type: 'button', onclick: loadPreview }, 'Load');
  async function loadPreview() {
    if (!v.url) { toast('Enter the feed URL first', true); return; }
    loadBtn.disabled = true; loadBtn.textContent = 'Loading…';
    try {
      preview = await api('POST', '/api/feeds/preview', { url: v.url });
      nameIn.placeholder = preview.title || 'Defaults to the feed title';
      update();
    } catch (e) {
      preview = null;
      previewBox.replaceChildren(h('div', { class: 'info-box err' }, e.message));
    } finally { loadBtn.disabled = false; loadBtn.textContent = 'Load'; }
  }
  function update() {
    if (!preview) return;
    const item = preview.items[0];
    if (!item) { previewBox.replaceChildren(h('span', { class: 'hint' }, (preview.title || 'The feed') + ' loaded but has no items yet.')); return; }
    const w = webhookById(v.webhooks[0]);
    const desc = v.summary_length > 0 ? cut(item.summary || '', v.summary_length) : '';
    previewBox.replaceChildren(
      h('div', { class: 'hint', style: { marginBottom: '10px' } },
        (preview.title || 'Feed') + ' · ' + plural(preview.count, 'item') + ' · newest post' + (w ? ' as sent to ' + whLabel(w) : '') + ':'),
      messagePreview({
        username: whName(w), avatar: whAvatar(w), content: w ? w.content : '',
        embed: { color: v.color, author: v.name || preview.title, title: item.title || '(untitled)', url: item.link,
                 description: desc, image: v.show_image ? item.image : '', footer: item.author,
                 timestamp: item.date ? item.date * 1000 : null }
      }));
  }

  const saveBtn = h('button', { class: 'btn primary', onclick: save }, editing ? 'Save' : 'Add feed');
  async function save() {
    if (!v.url) { toast('Feed URL is required', true); return; }
    if (!v.webhooks.length) { toast('Pick at least one webhook to post to', true); return; }
    saveBtn.disabled = true;
    try {
      if (editing) await api('PUT', '/api/feeds/' + encodeURIComponent(f.id), v);
      else await api('POST', '/api/feeds', v);
      close();
      toast(editing ? 'Feed saved' : 'Feed added — checking it now');
      await reloadConfig();
      if (S.detail && editing && S.detail.id === f.id) loadFeedItems(true);
      pollSoon();
    } catch (e) { toast(e.message, true); saveBtn.disabled = false; }
  }

  const close = modal(editing ? 'Edit feed' : 'Add feed', [
    field('Feed URL', h('div', { class: 'inline' }, urlIn, loadBtn), 'RSS or Atom'),
    h('div', { class: 'row' }, field('Name', nameIn, 'shown as the embed author'), h('div', { style: { flex: '0 0 auto' } }, field('Colour', colorIn))),
    field('Post to', targets, 'one or more webhooks — they can be in different servers'),
    h('div', { class: 'row' },
      field('Summary length', sumIn, 'characters, 0 hides it'),
      field('Images', h('label', { class: 'check' }, imgChk, 'Show the post image'))),
    field('Preview', previewBox)
  ], [h('button', { class: 'btn', onclick: function () { close(); } }, 'Cancel'), saveBtn]);
  if (editing) loadPreview();
}

function webhookModal(w) {
  const editing = !!w;
  const v = {
    name: editing ? w.name : '', url: '', username: editing ? w.username : '', avatar_url: editing ? w.avatar_url : '',
    avatar_data: '', thread_id: editing ? w.thread_id : '', content: editing ? w.content : ''
  };
  function input(key, attrs) {
    const i = h('input', Object.assign({ type: 'text', value: v[key] }, attrs || {}));
    i.addEventListener('input', function () { v[key] = i.value.trim(); update(); });
    return i;
  }
  const urlIn = input('url', { placeholder: editing ? w.url_masked + '   (leave empty to keep)' : 'https://discord.com/api/webhooks/…', autocomplete: 'off', spellcheck: 'false' });
  urlIn.addEventListener('paste', function () { setTimeout(function () { if (v.url) inspect(); }, 0); });
  const nameIn = input('name', { placeholder: 'e.g. Gaming server · #news' });
  const userIn = input('username', { placeholder: S.config.settings.username || 'RSS', maxlength: 80 });
  const avatarIn = input('avatar_url', { type: 'url', placeholder: 'https://…/image.png' });
  const threadIn = input('thread_id', { placeholder: 'optional', inputmode: 'numeric' });
  const contentIn = input('content', { placeholder: 'optional, e.g. <@&ROLE_ID> or @everyone' });
  const info = h('div');
  const avatarPreview = avatarImg('', 'avatar lg');
  const fileIn = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp', style: { display: 'none' } });
  const uploadNote = h('span', { class: 'hint' }, 'Upload sets the webhook\u2019s own avatar on Discord; a URL just overrides it per post.');
  fileIn.addEventListener('change', async function () {
    const file = fileIn.files[0];
    if (!file) return;
    try {
      v.avatar_data = await squareImage(file);
      v.avatar_url = ''; avatarIn.value = ''; avatarIn.disabled = true; avatarIn.placeholder = 'Uploaded: ' + file.name;
      update();
    } catch (e) { toast(e.message, true); }
  });
  function clearImage() {
    v.avatar_data = ''; v.avatar_url = ''; fileIn.value = '';
    avatarIn.value = ''; avatarIn.disabled = false; avatarIn.placeholder = 'https://…/image.png';
    update();
  }
  const previewBox = h('div', { class: 'preview' });
  const checkBtn = h('button', { class: 'btn', type: 'button', onclick: inspect }, 'Check');

  async function inspect() {
    if (!v.url && !editing) { toast('Paste the webhook URL first', true); return; }
    checkBtn.disabled = true; checkBtn.textContent = 'Checking…';
    try {
      const r = await api('POST', '/api/webhooks/inspect', v.url ? { url: v.url } : { id: w.id });
      info.replaceChildren(h('div', { class: 'info-box' }, avatarImg(r.avatar_url),
        h('div', null, h('div', null, '✔ ', h('b', null, r.name || 'Unnamed webhook'), ' is valid'),
          h('div', { class: 'muted' }, 'Server ' + r.guild_id + ' · channel ' + r.channel_id))));
      if (!v.name) { v.name = r.name || ''; nameIn.value = v.name; }
      if (!v.username) { v.username = r.name || ''; userIn.value = v.username; }
      if (!v.avatar_url && !v.avatar_data && r.avatar_url) { v.avatar_url = r.avatar_url; avatarIn.value = r.avatar_url; }
      update();
    } catch (e) {
      info.replaceChildren(h('div', { class: 'info-box err' }, e.message));
    } finally { checkBtn.disabled = false; checkBtn.textContent = 'Check'; }
  }
  function update() {
    avatarPreview.src = v.avatar_data || v.avatar_url || S.config.settings.avatar_url || DEFAULT_AVATAR;
    previewBox.replaceChildren(messagePreview({
      username: v.username || S.config.settings.username || 'RSS', avatar: avatarPreview.src, content: v.content,
      embed: { color: S.config.settings.color, author: 'Example Feed', title: 'A new post appears', url: '',
               description: 'Posts sent through this webhook will look like this.', footer: 'Author', timestamp: Date.now() }
    }));
  }

  const saveBtn = h('button', { class: 'btn primary', onclick: save }, editing ? 'Save' : 'Add webhook');
  async function save() {
    if (!editing && !v.url) { toast('The webhook URL is required', true); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      const body = Object.assign({}, v);
      if (!body.url) delete body.url;
      if (!body.avatar_data) delete body.avatar_data;
      if (editing) await api('PUT', '/api/webhooks/' + encodeURIComponent(w.id), body);
      else await api('POST', '/api/webhooks', body);
      close();
      toast(editing ? 'Webhook saved' : 'Webhook added — use "Send test" to try it');
      await reloadConfig();
    } catch (e) {
      toast(e.message, true);
      saveBtn.disabled = false; saveBtn.textContent = editing ? 'Save' : 'Add webhook';
    }
  }

  update();
  const close = modal(editing ? 'Edit webhook' : 'Add webhook', [
    field('Webhook URL', h('div', { class: 'inline' }, urlIn, checkBtn), 'Discord: Server Settings → Integrations → Webhooks → Copy Webhook URL'),
    info,
    field('Label', nameIn, 'only shown here, e.g. the server and channel'),
    field('Display name', userIn, 'the name posts appear under'),
    field('Image', h('div', { class: 'avatar-edit' }, avatarPreview,
      h('div', { class: 'side' }, avatarIn,
        h('div', { class: 'inline' },
          h('button', { class: 'btn small', type: 'button', onclick: function () { fileIn.click(); } }, 'Upload image…'),
          h('button', { class: 'btn small', type: 'button', onclick: clearImage }, 'Remove')),
        uploadNote, fileIn))),
    h('div', { class: 'row' }, field('Thread ID', threadIn, 'post into a thread / forum post'), field('Message text', contentIn, 'sent with each post')),
    field('Preview', previewBox)
  ], [h('button', { class: 'btn', onclick: function () { close(); } }, 'Cancel'), saveBtn]);
}

// ---- feed posts subpage ----------------------------------------------------
function openFeed(id) { location.hash = '#/feed/' + encodeURIComponent(id); }
function closeFeed() { S.detail = null; history.pushState(null, '', '#/feeds'); switchTab('feeds'); }
function applyHash() {
  const m = location.hash.match(/^#\/feed\/(.+)$/);
  if (m) {
    const id = decodeURIComponent(m[1]);
    const f = S.config.feeds.find(function (x) { return x.id === id; });
    S.tab = 'feeds';
    if (!f) { S.detail = null; }
    else if (!S.detail || S.detail.id !== id) {
      S.detail = { id: id, data: null, loading: false, error: '', targets: f.webhooks.slice(), open: {} };
      loadFeedItems();
    }
  } else {
    S.detail = null;
  }
  switchTab(S.tab);
  window.scrollTo(0, 0);
}
async function loadFeedItems(quiet) {
  const d = S.detail;
  if (!d) return;
  d.loading = true;
  if (!quiet) { d.error = ''; renderTab(); }
  try {
    const data = await api('GET', '/api/feeds/' + encodeURIComponent(d.id) + '/items');
    if (S.detail === d) { d.data = data; d.error = ''; }
  } catch (e) {
    if (S.detail === d) d.error = e.message;
  } finally {
    d.loading = false;
    if (S.detail === d && !document.querySelector('.overlay')) renderTab();
  }
}
function itemEmbed(f, it, w, feedTitle) {
  const desc = f.summary_length > 0 ? cut(it.summary || '', f.summary_length) : '';
  return messagePreview({
    username: whName(w), avatar: whAvatar(w), content: w ? w.content : '',
    embed: { color: f.color, author: f.name || feedTitle, title: it.title || '(untitled)', url: it.link, description: desc,
             image: f.show_image ? it.image : '', footer: it.author, timestamp: it.date ? it.date * 1000 : null }
  });
}
async function repost(f, items, btn) {
  const d = S.detail;
  if (!d.targets.length) { toast('Pick at least one webhook to send to', true); return; }
  const names = d.targets.map(function (id) { return whLabel(webhookById(id)); }).join(', ');
  if (items === 'all') {
    const n = d.data ? d.data.items.length : 0;
    if (!confirm('Repost all ' + plural(n, 'post') + ' from "' + (f.name || f.url) + '" to ' + names + '?\n\nThat sends ' +
        plural(n * d.targets.length, 'message') + ' (oldest first). You can cancel while it runs.')) return;
  }
  if (btn) btn.disabled = true;
  try {
    await api('POST', '/api/feeds/' + encodeURIComponent(f.id) + '/repost',
      items === 'all' ? { all: true, webhooks: d.targets } : { items: items, webhooks: d.targets });
    toast(items === 'all' ? 'Reposting all posts to ' + names + '…' : 'Reposting to ' + names + '…');
    refreshStatus();
  } catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}
async function cancelJob(job) {
  try { await api('POST', '/api/jobs/' + encodeURIComponent(job.id) + '/cancel'); toast('Cancelling…'); refreshStatus(); }
  catch (e) { toast(e.message, true); }
}
function jobView(j) {
  const active = j.state === 'queued' || j.state === 'running';
  const pct = j.total ? Math.round(100 * (j.done + j.failed) / j.total) : 0;
  const what = j.items ? plural(j.items, 'post') : 'all posts';
  let text;
  if (j.state === 'queued') text = 'Waiting to repost ' + what + '…';
  else if (j.state === 'running') text = 'Reposting ' + what + ': ' + (j.done + j.failed) + ' / ' + (j.total || '…') + (j.current ? ' · ' + cut(j.current, 60) : '');
  else if (j.state === 'cancelled') text = 'Repost cancelled after ' + plural(j.done, 'message');
  else text = (j.state === 'failed' ? 'Repost failed: ' : 'Repost finished: ') + j.message;
  return h('div', { class: 'job' },
    h('div', { class: 'body' },
      h('div', null, text, active ? null : h('span', { class: 'hint' }, ' · ' + ago(j.finished))),
      j.failed && active ? h('div', { class: 'hint', style: { color: '#ff7b7e' } }, plural(j.failed, 'failure') + ': ' + j.message) : null,
      active || j.total ? h('div', { class: 'progress' + (j.failed && !j.done ? ' err' : '') }, h('div', { style: { width: pct + '%' } })) : null),
    active ? h('button', { class: 'btn small danger', onclick: function () { cancelJob(j); } }, 'Cancel') : null);
}
function stateChip(w, s) {
  const label = whLabel(w);
  if (!s || s.state === 'new') return h('span', { class: 'chip new', title: 'Not sent to ' + label + ' yet; it will be on the next check' }, avatarImg(whAvatar(w), 'avatar sm'), label + ' · new');
  if (s.state === 'posted') return h('span', { class: 'chip posted', title: 'Sent ' + new Date(s.time * 1000).toLocaleString() }, avatarImg(whAvatar(w), 'avatar sm'), label + ' · posted ' + ago(s.time));
  return h('span', { class: 'chip skipped', title: 'Already in the feed when it was added (or over the per-check limit), so it was not sent' }, avatarImg(whAvatar(w), 'avatar sm'), label + ' · skipped');
}
function feedDetailView() {
  const d = S.detail;
  const f = S.config.feeds.find(function (x) { return x.id === d.id; });
  if (!f) { S.detail = null; return feedsView(); }
  const st = S.status.feeds[f.id];
  const feedTitle = (d.data && d.data.title) || (st && st.title) || '';
  const items = d.data ? d.data.items : [];

  const picker = h('div', { class: 'target-pick' }, h('span', { class: 'hint' }, 'Send to:'),
    S.config.webhooks.map(function (w) {
      const on = d.targets.indexOf(w.id) >= 0;
      const box = h('input', { type: 'checkbox', checked: on });
      box.addEventListener('change', function () {
        if (box.checked) d.targets.push(w.id); else d.targets = d.targets.filter(function (x) { return x !== w.id; });
        renderTab();
      });
      return h('label', { class: on ? 'on' : '', title: 'Posts as ' + whName(w) }, box, avatarImg(whAvatar(w), 'avatar sm'), whLabel(w));
    }));

  const now = Date.now() / 1000;
  // Active jobs, plus the most recent finished one for two minutes.
  let shownFinished = false;
  const jobs = S.status.jobs.filter(function (j) {
    if (j.feed_id !== f.id) return false;
    if (j.state === 'queued' || j.state === 'running') return true;
    if (shownFinished || now - j.finished > 120) return false;
    shownFinished = true;
    return true;
  });

  const head = h('div', { class: 'feed-head', style: { borderLeftColor: f.color } },
    h('h2', null, f.name || feedTitle || f.url,
      !f.enabled ? h('span', { class: 'badge' }, 'paused') : st ? h('span', { class: 'badge ' + (st.ok ? 'ok' : 'err'), title: st.message }, st.ok ? 'ok' : 'error') : null),
    h('div', { class: 'sub' }, h('a', { href: f.url, target: '_blank', rel: 'noopener noreferrer' }, f.url)),
    h('div', { class: 'hint' }, st ? 'Checked ' + ago(st.last_check) + ' · ' + st.message : 'Not checked yet'),
    h('div', { class: 'chips' }, f.webhooks.length ? 'Posts automatically to ' : 'No webhook selected',
      f.webhooks.map(function (id) { const w = webhookById(id); return h('span', { class: 'chip' }, avatarImg(whAvatar(w), 'avatar sm'), whLabel(w)); })));

  const repostAll = h('button', { class: 'btn primary', disabled: !items.length || !d.targets.length }, 'Repost all' + (items.length ? ' (' + items.length + ')' : ''));
  repostAll.addEventListener('click', function () { repost(f, 'all', repostAll); });
  const toolbar = h('div', { class: 'toolbar' },
    h('h2', null, 'Posts'), h('span', { class: 'hint' }, d.data ? plural(items.length, 'post') + ' currently in the feed' : ''),
    h('div', { class: 'spacer' }),
    h('button', { class: 'btn', disabled: d.loading, onclick: function () { loadFeedItems(); } }, d.loading ? 'Loading…' : 'Refresh'),
    h('button', { class: 'btn', onclick: function () { feedModal(f); } }, 'Edit feed'),
    repostAll);

  const list = h('div', { class: 'list' });
  if (d.error) list.append(h('div', { class: 'info-box err' }, d.error));
  else if (!d.data) list.append(h('div', { class: 'empty' }, h('b', null, 'Loading posts…'), 'Fetching ' + f.url));
  else if (!items.length) list.append(h('div', { class: 'empty' }, h('b', null, 'This feed has no posts right now')));
  for (const it of items) {
    const open = !!d.open[it.id];
    const meta = [it.date ? new Date(it.date * 1000).toLocaleString() : null, it.author].filter(Boolean).join(' · ');
    const btn = h('button', { class: 'btn small primary', disabled: !d.targets.length, title: 'Send this post again to the selected webhooks' }, 'Repost');
    btn.addEventListener('click', function () { repost(f, [it.id], btn); });
    list.append(h('div', { class: 'item' },
      h('div', { class: 'top' },
        it.image && f.show_image ? h('img', { class: 'thumb', src: it.image, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }) : null,
        h('div', { class: 'body' },
          it.link ? h('a', { class: 'ititle', href: it.link, target: '_blank', rel: 'noopener noreferrer' }, it.title || '(untitled)')
                  : h('span', { class: 'ititle' }, it.title || '(untitled)'),
          meta ? h('div', { class: 'meta' }, meta) : null,
          it.summary ? h('div', { class: 'clamp' }, it.summary) : null,
          h('div', { class: 'chips' }, f.webhooks.map(function (id) { return stateChip(webhookById(id), it.status[id]); }))),
        h('div', { class: 'actions' }, btn,
          h('button', { class: 'btn small', onclick: function () { d.open[it.id] = !open; renderTab(); } }, open ? 'Hide' : 'Preview'))),
      open ? h('div', { class: 'expanded preview' }, itemEmbed(f, it, webhookById(d.targets[0] || f.webhooks[0]), feedTitle)) : null));
  }

  return h('div', null,
    h('button', { class: 'back', onclick: closeFeed }, '← All feeds'),
    head,
    jobs.map(jobView),
    toolbar,
    h('div', { class: 'toolbar', style: { marginTop: '-6px' } }, picker),
    list);
}

// ---- start -----------------------------------------------------------------
document.querySelectorAll('#tabs button').forEach(function (b) {
  b.addEventListener('click', function () {
    if (S.detail) { S.detail = null; history.pushState(null, '', '#/' + b.dataset.tab); }
    switchTab(b.dataset.tab);
  });
});
$('#pollAll').addEventListener('click', function () { pollNow(); });
window.addEventListener('hashchange', function () { if (S.config && S.status) applyHash(); });
(async function init() {
  try {
    const both = await Promise.all([api('GET', '/api/config'), api('GET', '/api/status')]);
    S.config = both[0]; S.status = both[1];
    if (!S.config.webhooks.length) S.tab = 'webhooks';
    if (location.hash.indexOf('#/feed/') === 0) applyHash(); else switchTab(S.tab);
    renderHeader();
  } catch (e) {
    $('#main').replaceChildren(h('div', { class: 'empty' }, h('b', null, 'Cannot reach the bot'), e.message));
  }
  setInterval(refreshStatus, 5000);
})();
</script>
</body>
</html>
